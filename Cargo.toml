[package]
name = "debutility"
version = "0.3.0"
edition = "2021"
description = "Pulizia, diagnosi e info di sistema per Debian (clone di Stacer in Rust)"

[[bin]]
name = "debutility"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
sysinfo = "0.32"
egui_extras = { version = "0.29", features = ["all_loaders"] }
image = { version = "0.25", features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
rfd = "0.14" # Già utilissimo se usi finestre di dialogo native per i file

[profile.release]
opt-level = 3
lto = true
strip = true
